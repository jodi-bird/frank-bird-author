<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frank Bird | Author</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #13202b 0%, #081018 50%, #05090d 100%);
            color: #eee4d3;
            font-family: Georgia, "Times New Roman", serif;
        }

        .page {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 80px 20px 70px;
            text-align: center;
        }

        .name {
            margin: 0;
            font-size: clamp(2.6rem, 6vw, 5rem);
            font-weight: normal;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .author-line {
            width: min(330px, 50%);
            height: 1px;
            margin: 24px auto 18px;
            background: #bb8738;
        }

        .author {
            margin: 0 0 38px;
            color: #d8a24b;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
        }

        .cover {
            display: block;
            width: 60%;
            max-width: 700px;
            min-width: 280px;
            height: auto;
            margin: 0 auto;
            border: 1px solid rgba(198, 145, 57, 0.75);
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.45);
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 35px auto 20px;
        }

        .divider span {
            display: block;
            width: 100px;
            height: 1px;
            background: #b98739;
        }

        .drop {
            color: #d49b3d;
            font-size: 1.4rem;
        }

        .companion {
            margin: 0;
            font-size: clamp(1.15rem, 2.2vw, 1.8rem);
        }

        .book-title {
            margin: 7px 0 0;
            color: #d5a04a;
            font-size: clamp(1.25rem, 2.5vw, 2rem);
            font-style: italic;
        }

        .coming {
            margin: 28px 0 0;
            color: #d5a04a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            .page {
                padding-top: 45px;
            }

            .name {
                letter-spacing: 0.12em;
            }

            .cover {
                width: 85%;
            }

            .coming {
                letter-spacing: 0.3em;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <h1 class="name">Frank Bird</h1>

        <div class="author-line"></div>

        <p class="author">contact@frankbirdauthor.co.uk</p>

        <img
            class="cover"
            src="images/cover.png"
            alt="Water Water Everywhere by Frank Bird"
        >

        <div class="divider">
            <span></span>
            <div class="drop">♦</div>
            <span></span>
        </div>

        <p class="companion">
            Official website and companion to
        </p>

        <p class="book-title">
            Water Water Everywhere...
        </p>

        <p class="coming">
            Coming Soon
        </p>

    </main>

</body>
</html>
